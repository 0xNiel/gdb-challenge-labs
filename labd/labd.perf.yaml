# labd config for the perf suite (Phase 4): labd/perf/scenario.sh starts a private labd from it.
# The spec's capacity target: 100 slots, 50 queued (P6). Ports and challenges are rewritten by lib.sh.
listen_internal: 127.0.0.1:8081
listen_ws: 127.0.0.1:8082
containerd_socket: /run/containerd/containerd.sock
runtime: io.containerd.runsc.v1
max_sessions: 100
max_queue: 50
ws_reconnect_grace_s: 60
default_limits: {memory_mb: 128, cpu_millicores: 500, pids: 32, ttl_minutes: 60, idle_minutes: 15, extend_minutes: 15}
challenges_file: challenges.dev.json   # relative to this file; Phase 5 generates the real one
postgres_dsn: postgres://labd:labd@127.0.0.1:5432/labs
metrics_flush_s: 10
site_host: http://127.0.0.1:8082
dev_allow_no_origin: true           # Go client and perf scripts send no Origin
dev_testpage: false
